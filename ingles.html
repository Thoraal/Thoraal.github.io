<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Numbers - Professional App</title>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Variables de Tema */
        :root[data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-surface: #ffffff;
            --bg-nav: rgba(255, 255, 255, 0.8);
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #e2e8f0;
            --secondary-hover: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            --success: #10b981;
            --error: #ef4444;
            --interim-text: #94a3b8;
        }

        :root[data-theme="dark"] {
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --bg-nav: rgba(30, 41, 59, 0.8);
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --secondary: #334155;
            --secondary-hover: #475569;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            --success: #10b981;
            --error: #ef4444;
            --interim-text: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-nav);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar-brand {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            letter-spacing: -0.5px;
        }

        .navbar-brand i { color: var(--primary); }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon:hover {
            background-color: var(--secondary);
            color: var(--text-main);
        }

        /* Main Content */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .card {
            background-color: var(--bg-surface);
            width: 100%;
            max-width: 520px;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            padding: 2.5rem;
            border: 1px solid var(--border-color);
            position: relative;
        }

        /* Área Interactiva */
        .display-area {
            text-align: center;
            padding: 1rem 0 2rem 0;
            position: relative;
        }

        .main-number-input {
            width: 100%;
            background: transparent;
            border: none;
            text-align: center;
            font-size: 5rem;
            font-weight: 800;
            color: var(--text-main);
            outline: none;
            letter-spacing: -2px;
            padding: 0.5rem;
            border-radius: 16px;
        }

        .main-number-input:focus {
            background-color: rgba(37, 99, 235, 0.05);
            color: var(--primary);
        }

        .translation {
            font-size: 1.25rem;
            color: var(--text-muted);
            font-weight: 500;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            margin-top: 0.5rem;
            min-height: 1.5em;
        }

        .translation.visible {
            opacity: 1;
            transform: translateY(0);
            color: var(--primary);
        }

        /* Transcripción en Tiempo Real */
        .live-transcript-container {
            margin-top: 1.5rem;
            min-height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .live-transcript {
            background-color: var(--secondary);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-main);
            max-width: 90%;
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.3s ease;
            display: none;
            position: relative;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .live-transcript.active {
            opacity: 1;
            transform: scale(1);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Texto gris mientras hablas (Interim) */
        .interim-text {
            color: var(--interim-text);
            font-style: italic;
        }

        /* Animación de puntos suspensivos escuchando */
        .listening-indicator {
            display: flex;
            gap: 4px;
        }
        .listening-indicator span {
            width: 6px;
            height: 6px;
            background-color: var(--primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .listening-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .listening-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Feedback Veredicto */
        .feedback-message {
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .feedback-message.success { color: var(--success); }
        .feedback-message.error { color: var(--error); }

        /* Controles */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .row-btns { display: flex; gap: 1rem; flex-wrap: wrap; }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            flex: 1;
            box-shadow: var(--shadow-sm);
        }

        .btn:active { transform: translateY(1px); }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); box-shadow: var(--shadow-md); }

        .btn-secondary { background-color: var(--secondary); color: var(--text-main); }
        .btn-secondary:hover { background-color: var(--secondary-hover); }

        .btn-mic {
            background-color: var(--bg-surface);
            border: 2px solid var(--border-color);
            color: var(--text-main);
        }
        .btn-mic:hover { border-color: var(--primary); color: var(--primary); }

        .btn-mic.is-listening {
            border-color: var(--error);
            color: var(--error);
            background-color: rgba(239, 68, 68, 0.05);
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.3); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        /* Footer */
        .footer {
            background-color: var(--bg-nav);
            border-top: 1px solid var(--border-color);
            padding: 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: auto;
        }

        .footer p { display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
        .footer i { color: var(--error); } /* Corazón rojo */

        /* Responsive */
        @media (max-width: 600px) {
            .card { padding: 1.5rem; border-radius: 0; border-left: none; border-right: none; }
            .main-number-input { font-size: 4rem; }
            .navbar { padding: 1rem; }
            .row-btns { flex-direction: column; }
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-brand">
            <i class="fa-solid fa-graduation-cap"></i> EnglishNum Pro
        </div>
        <div>
            <button class="btn-icon" id="btnTheme" title="Cambiar Tema">
                <i class="fa-solid fa-moon"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-container">
        <div class="card">
            
            <div class="display-area">
                <!-- Hint visual -->
                <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.5rem;">
                    <i class="fa-solid fa-pen"></i> Toca el número para editarlo
                </div>
                
                <input type="text" inputmode="numeric" id="mainNumberInput" class="main-number-input" value="0">
                <div class="translation" id="translationDisplay">Zero</div>
            </div>

            <!-- Área de Transcripción en Tiempo Real -->
            <div class="live-transcript-container">
                <div class="live-transcript" id="liveTranscript">
                    <!-- Contenido inyectado por JS -->
                </div>
            </div>

            <!-- Controles -->
            <div class="controls">
                <button class="btn btn-primary" id="btnGenerate">
                    <i class="fa-solid fa-shuffle"></i> Generar Nuevo
                </button>
                
                <div class="row-btns">
                    <button class="btn btn-secondary" id="btnReveal">
                        <i class="fa-regular fa-eye"></i> Ver Letras
                    </button>
                    <button class="btn btn-secondary" id="btnListen">
                        <i class="fa-solid fa-volume-high"></i> Pronunciación
                    </button>
                </div>
                
                <!-- Botón de Micrófono Principal -->
                <button class="btn btn-mic" id="btnMic">
                    <i class="fa-solid fa-microphone"></i> Empezar a Hablar
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>Hecho con <i class="fa-solid fa-heart"></i> para aprender inglés • <span id="currentYear"></span></p>
    </footer>

    <script>
        // Configuración de Año en Footer
        document.getElementById('currentYear').textContent = new Date().getFullYear();

        // Configuración de Tema
        const html = document.documentElement;
        const btnTheme = document.getElementById('btnTheme');
        let currentTheme = localStorage.getItem('themeProApp') || 'light';
        html.setAttribute('data-theme', currentTheme);
        updateThemeIcon();

        function updateThemeIcon() {
            btnTheme.innerHTML = currentTheme === 'light' 
                ? '<i class="fa-solid fa-moon"></i>' 
                : '<i class="fa-solid fa-sun"></i>';
        }

        btnTheme.addEventListener('click', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', currentTheme);
            localStorage.setItem('themeProApp', currentTheme);
            updateThemeIcon();
        });

        // DOM Elements principales
        const mainInput = document.getElementById('mainNumberInput');
        const translationDisplay = document.getElementById('translationDisplay');
        const btnMic = document.getElementById('btnMic');
        const liveTranscript = document.getElementById('liveTranscript');

        // Formateo de Números (comas)
        function formatNumber(numStr) {
            let raw = numStr.replace(/\D/g, '');
            if (raw === '') return '0';
            return parseInt(raw, 10).toLocaleString('en-US');
        }

        function getRawNumber() {
            return parseInt(mainInput.value.replace(/,/g, ''), 10) || 0;
        }

        // Traducción a texto
        function numberToEnglish(n) {
            if (isNaN(n)) return '';
            if (n === 0) return 'zero';
            
            const units = ['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
            const tens = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
            let words = '';

            if (n >= 1000000) { words += numberToEnglish(Math.floor(n / 1000000)) + ' million '; n %= 1000000; }
            if (n >= 1000) { words += numberToEnglish(Math.floor(n / 1000)) + ' thousand '; n %= 1000; }
            if (n >= 100) { words += numberToEnglish(Math.floor(n / 100)) + ' hundred '; n %= 100; }
            if (n > 0) {
                if (words !== '') words += 'and '; 
                if (n < 20) words += units[n];
                else {
                    words += tens[Math.floor(n / 10)];
                    if (n % 10 > 0) words += '-' + units[n % 10];
                }
            }
            return words.trim();
        }

        // Lógica de Input Manual
        mainInput.addEventListener('input', (e) => {
            let cursorPosition = e.target.selectionStart;
            let lengthBefore = e.target.value.length;
            e.target.value = formatNumber(e.target.value);
            cursorPosition += (e.target.value.length - lengthBefore);
            e.target.setSelectionRange(cursorPosition, cursorPosition);
            
            resetFeedback();
            translationDisplay.textContent = numberToEnglish(getRawNumber());
        });

        mainInput.addEventListener('click', function() { this.select(); });

        function resetFeedback() {
            translationDisplay.classList.remove('visible');
            liveTranscript.classList.remove('active');
        }

        // Acciones Botones
        function generateNumber() {
            const randomNum = Math.floor(Math.random() * 1000) + 1;
            resetFeedback();
            mainInput.value = randomNum.toLocaleString('en-US');
            translationDisplay.textContent = numberToEnglish(randomNum);
        }

        function speakNumber() {
            if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(numberToEnglish(getRawNumber()));
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        document.getElementById('btnGenerate').addEventListener('click', generateNumber);
        document.getElementById('btnReveal').addEventListener('click', () => {
            translationDisplay.classList.add('visible');
            liveTranscript.classList.remove('active');
        });
        document.getElementById('btnListen').addEventListener('click', speakNumber);

        // RECONOCIMIENTO DE VOZ EN TIEMPO REAL
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = true; // ACTIVADO PARA TIEMPO REAL
            recognition.maxAlternatives = 1;

            recognition.onstart = () => {
                resetFeedback();
                btnMic.classList.add('is-listening');
                btnMic.innerHTML = '<i class="fa-solid fa-microphone-lines"></i> Te escucho...';
                
                liveTranscript.className = 'live-transcript active';
                liveTranscript.innerHTML = `
                    <div class="listening-indicator">
                        <span></span><span></span><span></span>
                    </div>
                `;
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                // Separar lo que está procesando (interim) de lo definitivo (final)
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                // Mostrar texto en tiempo real
                if (interimTranscript !== '') {
                    liveTranscript.innerHTML = `
                        <i class="fa-solid fa-microphone-lines" style="color: var(--primary);"></i>
                        <span class="interim-text">${interimTranscript}...</span>
                    `;
                }

                // Cuando el navegador decide que terminaste de hablar esa frase
                if (finalTranscript !== '') {
                    validateSpeech(finalTranscript);
                }
            };

            recognition.onerror = (event) => {
                liveTranscript.className = 'live-transcript active';
                if(event.error === 'not-allowed') {
                    liveTranscript.innerHTML = '<div class="feedback-message error"><i class="fa-solid fa-microphone-slash"></i> Micro denegado</div>';
                } else {
                    liveTranscript.innerHTML = '<div class="feedback-message error"><i class="fa-solid fa-triangle-exclamation"></i> No te entendí bien</div>';
                }
            };

            recognition.onend = () => {
                btnMic.classList.remove('is-listening');
                btnMic.innerHTML = '<i class="fa-solid fa-microphone"></i> Empezar a Hablar';
                
                // Si terminó y no se actualizó el texto, es que no detectó nada
                if(liveTranscript.innerHTML.includes('listening-indicator')) {
                    liveTranscript.innerHTML = '<div class="feedback-message error"><i class="fa-solid fa-comment-slash"></i> No se detectó voz</div>';
                }
            };

        } else {
            btnMic.style.display = 'none';
        }

        btnMic.addEventListener('click', () => {
            if (recognition) {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                    setTimeout(() => recognition.start(), 100);
                }
            } else {
                alert("Navegador no compatible con Speech API.");
            }
        });

        // Función para validar lo que dijiste vs el número
        function validateSpeech(transcript) {
            const lowerTranscript = transcript.toLowerCase();
            const targetNumber = getRawNumber();
            const targetWords = numberToEnglish(targetNumber).toLowerCase().replace(/-/g, ' ').replace(/ and /g, ' ');
            const cleanTranscript = lowerTranscript.replace(/-/g, ' ').replace(/ and /g, ' ');
            const targetDigitString = targetNumber.toString();

            let isCorrect = cleanTranscript.includes(targetDigitString) || cleanTranscript === targetWords;

            if (isCorrect) {
                liveTranscript.className = 'live-transcript active';
                liveTranscript.innerHTML = `<div class="feedback-message success"><i class="fa-solid fa-circle-check"></i> ¡Excelente! "${transcript}"</div>`;
            } else {
                liveTranscript.className = 'live-transcript active';
                liveTranscript.innerHTML = `<div class="feedback-message error"><i class="fa-solid fa-circle-xmark"></i> Dijiste: "${transcript}"</div>`;
                // Mostrar escritura correcta automáticamente para aprender
                translationDisplay.classList.add('visible');
            }
        }

        // Inicializar
        window.onload = generateNumber;
    </script>
</body>
</html>
