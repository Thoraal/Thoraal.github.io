name: Actualizar cotizaciones del fraccionador
on:
  schedule:
    - cron: '23 17,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: historial-fraccionador
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actualizar historial oficial
        env:
          BANXICO_TOKEN: ${{ secrets.BANXICO_TOKEN }}
        run: |
          if [ -z "$BANXICO_TOKEN" ]; then
            echo "::notice::Configura BANXICO_TOKEN para activar las actualizaciones."
            exit 0
          fi
          node scripts/cotizaciones.mjs public/cotizaciones.json
      - name: Publicar si hay cambios
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/cotizaciones.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/cotizaciones.json
          git commit -m 'Actualizar cotizaciones oficiales del fraccionador'
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
